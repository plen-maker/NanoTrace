[package]
name = "nanotrace"
version = "0.1.0"
edition = "2021"
description = "Keeps Claude Code memory in sync with plen-maker/nanotrace-vault; Ctrl+Alt+0 shows its status"

[dependencies]
anyhow = "1"
eframe = { version = "0.36.1", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
ureq = { version = "2", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
flate2 = "1"
tar = "0.4"
filetime = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
global-hotkey = "0.7"
winit = "0.30"

[profile.release]
strip = true
